# Flathub manifest for SudoVerse.
#
# IMPORTANT — before this can be *submitted* to Flathub:
# Flathub's own build farm disables network access during the build phase,
# but `cargo build` (invoked by `tauri build` below) needs to fetch every
# crate in Cargo.lock from crates.io, and `npm ci` needs the npm registry.
# The `--share=network` build-arg below is a CI-only convenience so this
# manifest builds as a sanity check on a normal GitHub Actions runner (which
# does not enforce that restriction) — Flathub's reviewers will reject a
# submission that keeps it. Before actually submitting, vendor the Cargo
# deps as extra `sources` entries, generated once via:
#   pip install --user aiohttp toml
#   curl -O https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py ../../src-tauri/Cargo.lock -o cargo-sources.json
# then add `- cargo-sources.json` to the `sources` list below, remove
# `--share=network`, and switch `npm ci` to an npm mirror/offline cache (npm
# has no first-party vendoring equivalent to Cargo's).
app-id: io.github.rafadono.SudoVerse
# org.gnome.Platform, not the bare org.freedesktop.Platform: the previous
# attempt failed compiling wry/tauri's webkit2gtk bindings with "Package
# javascriptcoregtk-4.1 not found" — that's part of WebKitGTK, which the
# bare Freedesktop runtime doesn't ship but the GNOME one does (it's the
# standard base for Tauri/Electron-style apps on Flathub for this reason).
runtime: org.gnome.Platform
# 47 turned out EOL since Oct 2025 ("Unknown extension ...//24.08" — the
# extension branch didn't even resolve because 47 pairs with freedesktop-sdk
# 24.08, and neither node20 nor rust-stable still publish that branch). 50 is
# GNOME's current non-EOL runtime; node20/rust-stable's current active
# branch is freedesktop-sdk 25.08, which lines up with it.
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20//25.08
  - org.freedesktop.Sdk.Extension.rust-stable//25.08
command: sudoverse

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.portal.OpenURI

modules:
  - name: sudoverse
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
    build-commands:
      - npm ci
      - npm run build:web
      # --no-bundle: this package only needs the compiled binary, not the
      # AppImage/deb/rpm bundles Tauri would otherwise also produce (and for
      # AppImage, download ~300MB of linuxdeploy tooling for).
      - npm --workspace @sudoku/desktop run tauri:build -- --no-bundle
      - install -Dm755 apps/desktop/src-tauri/target/release/sudoku_desktop /app/bin/sudoverse
      - install -Dm644 apps/desktop/flatpak/io.github.rafadono.SudoVerse.desktop
        /app/share/applications/io.github.rafadono.SudoVerse.desktop
      - install -Dm644 apps/desktop/flatpak/io.github.rafadono.SudoVerse.metainfo.xml
        /app/share/metainfo/io.github.rafadono.SudoVerse.metainfo.xml
      - install -Dm644 apps/desktop/src-tauri/icons/128x128.png
        /app/share/icons/hicolor/128x128/apps/io.github.rafadono.SudoVerse.png
    sources:
      - type: dir
        path: ../../../
      # - cargo-sources.json   # see the TODO above
