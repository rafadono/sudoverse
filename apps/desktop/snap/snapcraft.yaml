# Snap Store manifest for SudoVerse.
#
# This part does NOT compile anything — it just packages an already-built
# binary. Snapcraft copies `source:` into its own isolated part-build
# directory before packaging, so pointing it at the Cargo project and
# compiling in `override-build` (the previous approach) meant the Rust
# build cache the CI workflow sets up could never actually be reused: the
# compiler was writing into that copied path, not the cached one. The
# workflow now builds apps/desktop/src-tauri/target/release/sudoku_desktop
# as a normal step (reusing the same cached toolchain/target dir as the
# desktop-linux job) and stages just the binary at snap/stage-bin/bin/
# before calling snapcraft — see .github/workflows/build-apps.yml.
#
# Build locally: npm --workspace @sudoku/desktop run tauri:build -- --no-bundle
#                mkdir -p stage-bin/bin && cp ../src-tauri/target/release/sudoku_desktop stage-bin/bin/sudoverse
#                cd apps/desktop/snap && snapcraft
# Publish with:  snapcraft login && snapcraft upload *.snap
name: sudoverse
version: '0.2.0'
summary: Unified, multi-platform Sudoku game with 8 variants
description: |
  SudoVerse is a Sudoku game built on a shared TypeScript engine, with native
  support for Classic, Diagonal (X), Killer, Hyper (Windoku), Jigsaw
  (Irregular), Sandwich, Thermo, and Arrow Sudoku variants. Includes a
  backtracking solver, procedural puzzle generator, hints, and English and
  Spanish localization.
grade: stable
confinement: strict
base: core24
license: MIT

apps:
  sudoverse:
    command: bin/sudoverse
    plugs:
      - network
      - opengl
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - browser-support
    environment:
      DISABLE_WAYLAND: 1

parts:
  sudoverse:
    plugin: dump
    source: stage-bin
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - librsvg2-2
