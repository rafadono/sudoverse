name: Build Apps

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: sudo apt update
      - run: sudo apt install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install
      - run: npm run build:web
      - run: npm --workspace @sudoku/desktop run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage
            apps/desktop/src-tauri/target/release/bundle/deb
            apps/desktop/src-tauri/target/release/bundle/rpm

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm install
      - run: npm run build:web
      - run: npm --workspace @sudoku/desktop run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-bundles
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis
            apps/desktop/src-tauri/target/release/bundle/msi

  desktop-snap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Build directly on the (already ephemeral/sandboxed) runner instead of
      # inside a nested LXD container: skips container provisioning entirely
      # and lets the part's override-build see the toolchains installed below.
      SNAPCRAFT_BUILD_ENVIRONMENT: host
    steps:
      - uses: actions/checkout@v4
      # Installed here (not inside the part's override-build) so they use the
      # same fast, cached GitHub Actions toolchains as every other job instead
      # of a manual `curl | sh` rustup/nodesource install — that alone was the
      # biggest chunk of this job's time. With SNAPCRAFT_BUILD_ENVIRONMENT=host
      # the part build shares this same PATH, so its `command -v cargo`/`node`
      # guards find these and skip the slow manual install entirely.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: apps/desktop/snap
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-snap
          path: ${{ steps.snapcraft.outputs.snap }}

  desktop-flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Known-broken until Cargo dependencies are vendored for the sandboxed,
    # network-disabled flatpak-builder build — see the TODO in
    # apps/desktop/flatpak/io.github.rafadono.SudoVerse.yml. Kept non-blocking
    # so the rest of the pipeline stays green while that's pending.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Allow unattended flatpak system installs (polkit)
        # Without this, `flatpak-builder --install-deps-from` fails installing
        # the Sdk/runtime with "Flatpak system operation Deploy not allowed
        # for user" — there's no polkit authentication agent in this headless
        # runner to interactively approve the system-wide install.
        run: |
          sudo mkdir -p /etc/polkit-1/rules.d
          echo 'polkit.addRule(function(action, subject) {
              if (action.id.indexOf("org.freedesktop.Flatpak.") == 0) {
                  return polkit.Result.YES;
              }
          });' | sudo tee /etc/polkit-1/rules.d/49-nopasswd-flatpak.rules
          sudo systemctl restart polkit
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: sudoverse.flatpak
          manifest-path: apps/desktop/flatpak/io.github.rafadono.SudoVerse.yml
          cache-key: flatpak-builder-${{ github.sha }}

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install
      - name: Prebuild mobile app
        working-directory: apps/mobile
        env:
          CI: 1
        run: npx expo prebuild --platform android
      - run: |
          cd apps/mobile/android
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
